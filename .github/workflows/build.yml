name: Build Android APK From ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "project.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project.zip
        run: |
          if [ ! -f project.zip ]; then
            echo "ERROR: project.zip was not found."
            exit 1
          fi

          echo "project.zip found."

      - name: Extract project.zip
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q project.zip -d extracted

          echo "Project contents:"
          find extracted -maxdepth 4 -type f | head -200

      - name: Find Android project
        run: |
          if [ -f extracted/settings.gradle.kts ]; then
            PROJECT_DIR="extracted"
          elif [ -f extracted/settings.gradle ]; then
            PROJECT_DIR="extracted"
          else
            PROJECT_DIR=$(find extracted \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Your project.zip must contain settings.gradle or settings.gradle.kts."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Gradle
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "Using Gradle wrapper."
          else
            echo "No Gradle wrapper found."
            echo "Installing Gradle 8.10.2..."

            cd "$GITHUB_WORKSPACE"

            curl -L \
              -o gradle.zip \
              https://services.gradle.org/distributions/gradle-8.10.2-bin.zip

            unzip -q gradle.zip

            echo "$GITHUB_WORKSPACE/gradle-8.10.2/bin" >> "$GITHUB_PATH"
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "APK generated:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Developer-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14
