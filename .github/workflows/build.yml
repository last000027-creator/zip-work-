name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project.zip
        run: |
          if [ ! -f project.zip ]; then
            echo "ERROR: project.zip was not found."
            echo "Upload your Android project as project.zip in the repository root."
            exit 1
          fi

      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q project.zip -d extracted

      - name: Find Android project
        id: find_project
        run: |
          PROJECT_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found."
            echo "Installing Gradle 8.10.2..."

            wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
            unzip -q gradle-8.10.2-bin.zip
            export PATH="$PWD/gradle-8.10.2/bin:$PATH"

            gradle assembleDebug
          fi

      - name: Find APK
        id: apk
        run: |
          APK=$(find extracted -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Developer-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
