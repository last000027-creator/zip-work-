name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project.zip
        run: |
          if [ ! -f project.zip ]; then
            echo "ERROR: project.zip was not found."
            exit 1
          fi

          echo "project.zip found:"
          ls -lh project.zip

      - name: Extract project.zip
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q project.zip -d extracted

          echo "===== Extracted files ====="
          find extracted -maxdepth 5 -type f | head -200

      - name: Find Android project
        id: find_project
        shell: bash
        run: |
          PROJECT_FILE=$(find extracted -type f \( \
            -name "settings.gradle" \
            -o \
            -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android Gradle project was not found."
            echo ""
            echo "The ZIP must contain settings.gradle or settings.gradle.kts."
            echo ""
            echo "Files found inside project.zip:"
            find extracted -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "===== Android project ====="
          pwd
          ls -la

          if [ -f "./gradlew" ]; then
            echo "Using Gradle wrapper..."
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found."
            echo "Installing Gradle 8.10.2..."

            wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
            unzip -q gradle-8.10.2-bin.zip

            export PATH="$PWD/gradle-8.10.2/bin:$PATH"

            gradle assembleDebug
          fi

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          APK=$(find extracted -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find extracted -type f
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Developer-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
